services:
  database:
    image: postgres:17-alpine
    container_name: triago-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: triago
      POSTGRES_USER: triago
      POSTGRES_PASSWORD: triago
    ports:
      - "5434:5432"
    volumes:
      - triago_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triago -d triago"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - triago-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: triago-backend
    restart: unless-stopped
    working_dir: /var/www/backend
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://triago:triago@database:5432/triago?serverVersion=17&charset=utf8
      PHP_IDE_CONFIG: "serverName=localhost"
    volumes:
      - ./backend:/var/www/backend
      - backend_var:/var/www/backend/var
    depends_on:
      database:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - triago-network

  backend-web:
    image: nginx:1.27-alpine
    container_name: triago-backend-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
    depends_on:
      - backend
    networks:
      - triago-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: triago-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-web
    networks:
      - triago-network

volumes:
  triago_db_data:
  backend_var:

networks:
  triago-network:
    driver: bridge
